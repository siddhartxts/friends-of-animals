# pg-nonprod: PostgreSQL 18 configuration (config_file; docker/postgres is
# mounted read-only at /etc/postgresql, see prod.conf).
#
# Staging (`foa_staging`), the preview template (`foa_seed`) and one database
# per preview (`foa_pr_<n>_<fp>`, `foa_br_<slug>_<hash>_<fp>`). Never production data. No WAL
# archiving and no PITR. Container limits (compose.yml): 2 CPUs, 4 GB RAM.

# Connections ------------------------------------------------------------
listen_addresses = '*'            # only reachable on the private Docker network
port = 5432
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/postgresql/pg_hba.nonprod.conf'
# PgBouncer opens up to 10+2 per preview database and user; previews are many
# and small.
max_connections = 200
superuser_reserved_connections = 3
password_encryption = scram-sha-256
ssl = off

# Memory -----------------------------------------------------------------
shared_buffers = 1GB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 256MB
dynamic_shared_memory_type = posix

# Planner and I/O --------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
max_parallel_workers_per_gather = 1
max_parallel_workers = 2

# WAL ----------------------------------------------------------------------------
wal_level = replica
wal_compression = zstd
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
archive_mode = off

# Sessions ---------------------------------------------------------------------
idle_in_transaction_session_timeout = '10min'
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
# Never record utility statements: pg_stat_statements keeps their text as
# typed, so ALTER ROLE ... PASSWORD from the bootstrap would land in it.
pg_stat_statements.track_utility = off

# Logging (stderr -> docker logs) -------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
log_checkpoints = on
log_lock_waits = on
log_min_duration_statement = 1000
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_autovacuum_min_duration = '10min'
