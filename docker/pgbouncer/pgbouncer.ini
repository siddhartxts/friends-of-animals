;; PgBouncer 1.26 for FOA: the only public database endpoint,
;; db.shipped-it.dev:6432 (TLS required, SCRAM). See docker/README.md.
;;
;; Server addresses are the fixed IPs from compose.yml (network `db`):
;;   10.112.12.10 pg-prod, 10.112.12.11 pg-nonprod.
;; Apply changes with: docker kill -s HUP foa-pgbouncer   (RELOAD)

[databases]
;; Auth-only entries, named by auth_dbname below. PgBouncer runs auth_query
;; (as pgbouncer_auth) in each server's maintenance database `postgres`,
;; where pgbouncer.get_auth() lives. auth_dbname names an entry in this
;; section, not a server database, so these must exist: without them
;; "postgres" would fall through to the `*` entry, i.e. pg-nonprod, for prod
;; logins too. A client that names one of them gets no further than with
;; `postgres` itself: on pg-prod pg_hba lets only pgbouncer_auth (and the
;; host-side superuser) in; on pg-nonprod nonprod_migrator also connects there
;; by design, to run CREATE DATABASE for previews.
pgbouncer_auth_prod = host=10.112.12.10 port=5432 dbname=postgres pool_size=3 reserve_pool_size=0
pgbouncer_auth_nonprod = host=10.112.12.11 port=5432 dbname=postgres pool_size=3 reserve_pool_size=0

;; Production: only `foa` routes to pg-prod.
foa = host=10.112.12.10 port=5432 dbname=foa auth_dbname=pgbouncer_auth_prod pool_size=20 reserve_pool_size=5

;; Everything else routes to pg-nonprod: foa_staging, foa_pr_<n>_<fp>,
;; foa_br_<slug>_<hash>_<fp>, and `postgres` (where preview builds run CREATE
;; DATABASE). Entries are made
;; on demand and dropped after autodb_idle_timeout. foa_seed is refused by the
;; server (ALLOW_CONNECTIONS false). Pools are per database and user.
* = host=10.112.12.11 port=5432 auth_dbname=pgbouncer_auth_nonprod pool_size=10 reserve_pool_size=2

[users]
;; Migrations (DIRECT_URL) need session state: advisory locks, multi-statement
;; migrations. Session mode for the migrator roles only.
foa_migrator = pool_mode=session max_user_connections=10
staging_migrator = pool_mode=session max_user_connections=10
nonprod_migrator = pool_mode=session max_user_connections=20

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
;; Container-local socket only (tmpfs /tmp).
unix_socket_dir = /tmp

;; Authentication ----------------------------------------------------------
auth_type = scram-sha-256
;; Holds only pgbouncer_auth's password (plain text: PgBouncer must log in to
;; Postgres as auth_user itself, which a SCRAM secret cannot do). Everyone
;; else comes from auth_query, and SCRAM pass-through then logs the client in
;; to Postgres with its own credentials.
auth_file = /run/secrets/pgbouncer_userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)
;; No admin console users: SHOW/RELOAD go through signals or docker exec.
admin_users =
stats_users =

;; Pooling -----------------------------------------------------------------
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
;; max_prepared_statements: default (200), so postgres.js prepare:true works
;; through transaction mode if the app ever turns it on.
server_reset_query = DISCARD ALL
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 5
server_login_retry = 5
autodb_idle_timeout = 3600

;; Timeouts ----------------------------------------------------------------
;; Reap sockets left behind by suspended Vercel instances.
client_idle_timeout = 600
client_login_timeout = 15
;; A query waits at most this long for a free server connection.
query_wait_timeout = 20
;; Free the server connection if a client sits idle inside a transaction.
idle_transaction_timeout = 60
cancel_wait_timeout = 10
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 6

;; TLS ---------------------------------------------------------------------
;; Clients must use TLS (sslmode=verify-full against the Let's Encrypt cert).
;; Direct TLS negotiation (sslnegotiation=direct, PgBouncer >= 1.25) has no
;; switch and is accepted alongside the classic SSLRequest.
client_tls_sslmode = require
client_tls_cert_file = /etc/pgbouncer/tls/server.crt
client_tls_key_file = /etc/pgbouncer/tls/server.key
client_tls_protocols = secure
client_tls_ciphers = default
;; The hop to Postgres stays on the private Docker network.
server_tls_sslmode = disable

;; Logging (stderr -> docker logs -> CrowdSec) ------------------------------
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 300
